        <div id="korok_calc">
            <h2>Korok Calculator</h2>
            <div class="input-2">
                <label><b>Korok seeds spent</b></label>
                <input type="number"  min="0" max="441" step="1" name="input5" id="spentKorokSeeds" value="" placeholder="Enter your value. (max:441)" />
            </div>           
            <div class="input-2">
                <label><b>Korok seeds in inventory</b></label>
                <input type="number"  min="0" max="900" step="1" name="input6" id="unspentKorokSeeds" value="" placeholder="Enter your value. (max:900)" />                
            </div>
            <div>
                <div type="add" class="subbutton" onclick="onadd()">Add</div>
                <div type="fill" class="subbutton" onclick="onfill()">Auto Fill</div>
            </div>
            <div class="outputadd" id="outputadd"></div>
        </div>
<!-- -->

        <div id="comp_calc">
            <h2>Completion Calculator</h2>    
            <div class="input-1">
                <label>Shrines Completed</label>
                <input type="number"  min="0" max="120" step="1" name="input1" id="shrinesCompleted" value="" placeholder="Enter your value. (max:120)" />
            </div>
            <div class="input-2">
                <label>Divine Beasts Completed</label>
                <input type="number"  min="0" max="4" step="1" name="input2" id="divineBeastsCompleted" value="" placeholder="Enter your value. (max:4)"/>
            </div>
            <div class="input-3">
                <label>Koroks Found</label>
                <input type="number"  min="0" max="900" step="1" name="input3" id="koroksFound" value="" placeholder="Enter your value. (max:900)"/>
            </div>
            <div class="input-4">
                <label>Current Completion %</label>
                <input type="number"  min="0" max="100" step="1" name="input4" id="currentCompletionPercentage" value="" placeholder="Enter your value. (max:100)"/>
            </div>

        <script>
            function doHashThings(event) {
                console.log("HASH:", document.location.hash);
                const hash = document.location.hash;
                switch (hash) {
                    case "#korok":
                        document.getElementById("comp_calc").style.display = "none";
                        document.getElementById("korok_calc").style.display = "block";
                        break;
                    case "#comp":
                        document.getElementById("korok_calc").style.display = "none";
                        document.getElementById("comp_calc").style.display = "block";
                        break;
                    default:
                        document.getElementById("comp_calc").style.display = "block";
                        document.getElementById("korok_calc").style.display = "block";
                        break;
                }
            }

            doHashThings(null);
            window.addEventListener('hashchange', doHashThings);
                
 
            
        </script>
